<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>McDonald's Cart</title>
<link rel="icon" href="https://www.mcdonalds.com/content/dam/sites/dk/nfl/logo/McD_GoldenArches_1235_RGB.png"/>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1 id="pageTitle">Loading...</h1>
<p id="status">Loading...</p>
<div id="productGrid" class="grid"></div>

<nav id="navBottom" class="nav-bottom"></nav>

<div id="cart">
  <h2 id="cartTitle">Cart #1</h2>
  <div id="cartItems"></div>
  <p id="cartTotal"></p>
  <button id="checkoutBtn">Checkout</button>
</div>

<div id="overlay">
  <div id="overlayContent">
    <h2>Your Order</h2>
    <div id="overlayItems"></div>
    <div id="overlayTotal"></div>
    <button id="payBtn">Pay</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
