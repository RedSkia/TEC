<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedSkia Gateway | Merchant Integration Lab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background: #050505;
            color: #e0e0e0;
            font-family: 'Inter', system-ui, sans-serif;
        }

        .merchant-card {
            background: #0c0c0c;
            border: 1px solid #1f1f1f;
            border-top: 4px solid #dc3545;
            border-radius: 1rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        .form-control {
            background-color: #111 !important;
            border: 1px solid #222 !important;
            color: #fff !important;
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            transition: all 0.3s;
        }

            .form-control:focus {
                border-color: #dc3545 !important;
                box-shadow: 0 0 0 3px rgba(220, 53, 69, 0.1) !important;
            }

        .form-label {
            letter-spacing: 1.5px;
            font-weight: 700;
            font-size: 0.75rem;
            color: #888;
        }

        .btn-redskia {
            background: #dc3545;
            color: white;
            border-radius: 0.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.2s;
        }

            .btn-redskia:hover {
                background: #b02a37;
                color: white;
                transform: translateY(-2px);
            }

        pre {
            background: #000;
            padding: 20px;
            color: #0dcaf0;
            border: 1px solid #222;
            border-radius: 0.5rem;
            font-size: 0.85rem;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="merchant-card p-4 p-md-5">
                    <div class="d-flex align-items-center mb-4">
                        <i class="bi bi-cpu text-danger fs-2 me-3"></i>
                        <div>
                            <h3 class="fw-bolder text-white mb-0" style="letter-spacing: -1px;">INTEGRATION LAB</h3>
                            <p class="text-secondary small mb-0">RedSkia WebAPI Environment</p>
                        </div>
                    </div>

                    <hr class="border-secondary opacity-25 mb-4">

                    <div class="mb-3">
                        <label class="form-label text-uppercase">Merchant Bank Account ID</label>
                        <input type="number" id="merchantId" class="form-control" value="1">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-uppercase">Order Amount (USD)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-secondary">$</span>
                            <input type="number" id="amount" class="form-control" value="59.99">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-uppercase">Webhook Callback URL</label>
                        <input type="text" id="webhook" class="form-control" placeholder="https://webhook.site/...">
                        <div class="form-text text-secondary mt-2 small">Tip: Generate a URL at webhook.site to test callbacks.</div>
                    </div>

                    <button id="submitBtn" class="btn btn-redskia w-100 py-3 mt-2" onclick="initiateCheckout()">
                        <i class="bi bi-box-arrow-up-right me-2"></i> Create Payment Intent
                    </button>
                </div>

                <div id="resultArea" class="mt-4" style="display: none;">
                    <div class="merchant-card p-4">
                        <h6 class="text-uppercase text-secondary fw-bold mb-3" style="letter-spacing: 1px;">API Response Data</h6>
                        <pre id="apiOutput" class="mb-4"></pre>
                        <a id="checkoutBtn" class="btn btn-outline-light fw-bold w-100 py-3 text-uppercase" style="letter-spacing: 1px;" target="_blank">
                            Launch Secure Gateway <i class="bi bi-arrow-right ms-2"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function initiateCheckout() {
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> CONNECTING...';
            btn.disabled = true;

            const payload = {
                amount: parseFloat(document.getElementById('amount').value),
                merchantName: "REDSKIA_STOREFRONT",
                webhookUrl: document.getElementById('webhook').value,
                merchantBankAccountId: parseInt(document.getElementById('merchantId').value)
            };

            try {
                const response = await fetch('/api/checkout/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                document.getElementById('resultArea').style.display = 'block';
                document.getElementById('apiOutput').innerText = JSON.stringify(data, null, 2);

                // Da API'et nu returnerer den rene, korrekte URL, sætter vi den bare direkte ind.
                document.getElementById('checkoutBtn').href = data.redirectUrl;

            } catch (err) {
                alert("API Error! Could not reach the RedSkia API.");
                console.error(err);
            } finally {
                btn.innerHTML = '<i class="bi bi-box-arrow-up-right me-2"></i> Create Payment Intent';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
