<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Onyx Gateway | Merchant Integration Lab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #0b0b0b;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
        }

        .merchant-card {
            background: #151515;
            border: 1px solid #333;
            border-top: 4px solid #dc3545;
            border-radius: 0;
        }

        .btn-onyx {
            background: #dc3545;
            color: white;
            border-radius: 0;
            font-weight: bold;
            text-transform: uppercase;
        }

        pre {
            background: #000;
            padding: 15px;
            color: #00ff00;
            border: 1px solid #222;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="merchant-card p-5 shadow-lg">
                    <h2 class="mb-4">INTEGRATION LAB</h2>
                    <p class="text-secondary small">Simulate a merchant request to the Onyx WebAPI.</p>
                    <hr class="border-secondary">

                    <div class="mb-3">
                        <label class="form-label small text-uppercase">Merchant Account ID</label>
                        <input type="number" id="merchantId" class="form-control bg-dark text-white border-secondary" value="1">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-uppercase">Amount (USD)</label>
                        <input type="number" id="amount" class="form-control bg-dark text-white border-secondary" value="59.99">
                    </div>
                    <div class="mb-4">
                        <label class="form-label small text-uppercase">Webhook Callback (Use Webhook.site)</label>
                        <input type="text" id="webhook" class="form-control bg-dark text-white border-secondary" placeholder="https://webhook.site/...">
                    </div>

                    <button class="btn btn-onyx w-100 py-3" onclick="initiateCheckout()">Pay with Onyx Vault</button>
                </div>

                <div id="resultArea" class="mt-4" style="display: none;">
                    <h6 class="text-uppercase text-secondary">API Response:</h6>
                    <pre id="apiOutput"></pre>
                    <a id="checkoutBtn" class="btn btn-success w-100" target="_blank">Go to Secure Checkout &rarr;</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function initiateCheckout() {
            const payload = {
                amount: parseFloat(document.getElementById('amount').value),
                merchantName: "ONYX_STORE_LAB",
                webhookUrl: document.getElementById('webhook').value,
                merchantBankAccountId: parseInt(document.getElementById('merchantId').value)
            };

            try {
                // RELATIVE PATH: It knows to look on the same port (7001)
                const response = await fetch('/api/checkout/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                document.getElementById('resultArea').style.display = 'block';
                document.getElementById('apiOutput').innerText = JSON.stringify(data, null, 2);
                document.getElementById('checkoutBtn').href = data.redirectUrl;

            } catch (err) {
                alert("API Error! Make sure the BlazorApp is running.");
            }
        }
    </script>
</body>
</html>
