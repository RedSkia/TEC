services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bankapp-sql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=BankAppPassword123!
    ports:
      - "1433:1433"
    networks:
      - bank-net

  webapi:
    image: ${DOCKER_REGISTRY-}webapi
    build:
      context: .
      dockerfile: WebAPI/Dockerfile
    depends_on:
      - database
    ports:
      - "5001:8080" # Access API at localhost:5001
    environment:
      - ConnectionStrings__DefaultConnection=Server=database;Database=BankDb;User Id=sa;Password=BankAppPassword123!;TrustServerCertificate=True
    networks:
      - bank-net

  blazorapp:
    image: ${DOCKER_REGISTRY-}blazorapp
    build:
      context: .
      dockerfile: BlazorApp/Dockerfile
    depends_on:
      - database
    ports:
      - "7001:8080" # Access UI at localhost:7001
    environment:
      - ConnectionStrings__DefaultConnection=Server=database;Database=BankDb;User Id=sa;Password=BankAppPassword123!;TrustServerCertificate=True
    networks:
      - bank-net

networks:
  bank-net:
    driver: bridge